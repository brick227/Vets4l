<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V4L CMMC Readiness</title>
<meta name="description" content="Vets 4 Life CMMC Level 2 readiness dashboard: 110 NIST SP 800-171 requirements at a glance.">
<!-- Fonts are optional: every stack falls back to local fonts, so the page works offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8ecf1;
    --panel: #ffffff;
    --panel-2: #f3f5f8;
    --ink: #0f1d33;
    --ink-2: #1c2d4a;
    --text: #172031;
    --muted: #5a6577;
    --line: #d3d9e2;
    --brass: #9c7726;
    --brass-hi: #c9a24b;
    --on-ink: #e9edf3;
    --focus: #2f6fd1;

    --met: #2e8250;
    --partial: #b9800f;
    --notmet: #b8392c;
    --na: #7d8796;
    --unassessed: #cfd6df;
    --unassessed-text: #4b5566;

    --display: "Oswald", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
    --radius: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1220; --panel: #121b2c; --panel-2: #18233a; --ink: #070d18; --ink-2: #16233b;
      --text: #e4e9f1; --muted: #98a4b8; --line: #27344d; --brass: #c9a24b; --brass-hi: #e0bd6b;
      --on-ink: #e9edf3; --focus: #6fa2ff;
      --met: #3fae74; --partial: #e2a73c; --notmet: #e5604f; --na: #8a95a7; --unassessed: #34405a; --unassessed-text: #c5cdda;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1220; --panel: #121b2c; --panel-2: #18233a; --ink: #070d18; --ink-2: #16233b;
    --text: #e4e9f1; --muted: #98a4b8; --line: #27344d; --brass: #c9a24b; --brass-hi: #e0bd6b;
    --on-ink: #e9edf3; --focus: #6fa2ff;
    --met: #3fae74; --partial: #e2a73c; --notmet: #e5604f; --na: #8a95a7; --unassessed: #34405a; --unassessed-text: #c5cdda;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.5 var(--body); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .02em; margin: 0; }
  .mono { font-family: var(--mono); }

  /* Top bar */
  .topbar { background: var(--ink); color: var(--on-ink); border-bottom: 3px solid var(--brass); }
  .topbar-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 20px; max-width: 1400px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand svg { width: 34px; height: 34px; flex: none; }
  .brand-name { font: 600 13px/1.1 var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--brass-hi); }
  .brand h1 { font-size: 22px; text-transform: uppercase; line-height: 1.1; }
  .client { font-size: 14px; color: #b9c3d3; }
  .sample-badge { display: inline-block; font: 700 11px/1 var(--mono); letter-spacing: .08em; padding: 4px 7px; border: 1px solid var(--brass-hi); color: var(--brass-hi); border-radius: 3px; margin-left: 6px; vertical-align: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { border: 1px solid #3a4a68; background: var(--ink-2); color: var(--on-ink); padding: 7px 12px; border-radius: var(--radius); cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn:hover { border-color: var(--brass-hi); }
  .btn.primary { background: var(--brass); border-color: var(--brass); color: #10151f; }
  .btn.primary:hover { background: var(--brass-hi); }

  /* Layout */
  .layout { display: grid; grid-template-columns: 230px 1fr; gap: 20px; max-width: 1400px; margin: 0 auto; padding: 20px; }
  aside { display: flex; flex-direction: column; gap: 16px; }
  .nav { display: flex; flex-direction: column; gap: 4px; }
  .nav button { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: var(--radius); cursor: pointer; font: 600 15px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-left: 3px solid transparent; }
  .nav button:hover { background: var(--panel); color: var(--text); }
  .nav button[aria-current="page"] { background: var(--panel); color: var(--text); border-left-color: var(--brass); }
  .nav .count { float: right; font: 600 12px/1.6 var(--mono); color: var(--muted); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .card h2 { font-size: 17px; text-transform: uppercase; margin-bottom: 12px; }
  .card h2 .sub { font: 400 13px/1 var(--body); text-transform: none; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
  .own dl { margin: 0; display: grid; gap: 8px; font-size: 14px; }
  .own dt { font: 600 11px/1.2 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .own dd { margin: 0; font-weight: 600; }
  .own dd.unassigned { color: var(--notmet); }
  .own dd.unassigned::before { content: "⚠ "; }
  .note { font-size: 13px; color: var(--muted); }

  main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
  .view-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
  .view-head h2 { font-size: 26px; text-transform: uppercase; }
  .view-head p { margin: 0; color: var(--muted); }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: 2fr repeat(4, 1fr); gap: 12px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--ink-2); border-radius: var(--radius); padding: 14px 16px; }
  .kpi .label { font: 600 12px/1.2 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .kpi .value { font: 700 30px/1.15 var(--mono); margin-top: 6px; }
  .kpi .value small { font-size: 16px; color: var(--muted); font-weight: 500; }
  .kpi .hint { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .kpi.sprs { border-top-color: var(--brass); }
  .kpi.gaps .value { color: var(--notmet); }
  .kpi.partial .value { color: var(--partial); }
  .stack { display: flex; height: 12px; border-radius: 3px; overflow: hidden; margin-top: 10px; background: var(--unassessed); }
  .stack span { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  .bg-met { background: var(--met); } .bg-partial { background: var(--partial); } .bg-notmet { background: var(--notmet); }
  .bg-na { background: var(--na); } .bg-unassessed { background: var(--unassessed); }

  /* Family map */
  .cockpit-grid { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
  .families { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .fam { text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 11px 11px; cursor: pointer; }
  .fam:hover { border-color: var(--brass); }
  .fam-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .fam-code { font: 700 15px/1 var(--mono); }
  .fam-score { font: 600 12px/1 var(--mono); color: var(--muted); }
  .fam-name { font-size: 12.5px; color: var(--muted); margin: 4px 0 8px; line-height: 1.25; min-height: 2.5em; }
  .squares { display: flex; flex-wrap: wrap; gap: 3px; }
  .squares i { width: 12px; height: 12px; border-radius: 2px; display: block; }

  /* Fix first */
  .fix { list-style: none; margin: 0; padding: 0; }
  .fix li + li { border-top: 1px solid var(--line); }
  .fix button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; padding: 9px 2px; cursor: pointer; }
  .fix button:hover .fix-req { color: var(--text); }
  .fix-id { font: 700 13px/1.3 var(--mono); }
  .fix-req { font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fix-pts { font: 700 13px/1.3 var(--mono); color: var(--notmet); white-space: nowrap; }
  .fix-empty { color: var(--muted); font-size: 14px; }

  /* Status pills & tags */
  .pill { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 4px 10px 4px 8px; font: 700 12.5px/1.2 var(--body); white-space: nowrap; cursor: pointer; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .9; }
  .pill.met { background: color-mix(in srgb, var(--met) 18%, transparent); color: var(--met); }
  .pill.partial { background: color-mix(in srgb, var(--partial) 20%, transparent); color: var(--partial); }
  .pill.notmet { background: color-mix(in srgb, var(--notmet) 18%, transparent); color: var(--notmet); }
  .pill.na { background: color-mix(in srgb, var(--na) 22%, transparent); color: var(--na); }
  .pill.unassessed { background: var(--unassessed); color: var(--unassessed-text); }
  .pill.static { cursor: default; }
  .tag { display: inline-block; font: 700 11px/1 var(--mono); letter-spacing: .04em; padding: 4px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
  .tag.basic { border-color: var(--brass); color: var(--brass); }
  .sev { display: inline-block; font: 700 12px/1 var(--body); padding: 5px 8px; border-radius: 3px; color: #fff; }
  .sev.Critical { background: #7a1f1f; } .sev.High { background: var(--notmet); } .sev.Medium { background: var(--partial); color: #1b1404; } .sev.Low { background: var(--na); }

  /* Tables */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .filters input, .filters select { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }
  .filters input { flex: 1 1 260px; }
  .filters .shown { font-size: 14px; color: var(--muted); margin-left: auto; }
  .table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  th { text-align: left; font: 600 12px/1.2 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); background: var(--panel-2); padding: 10px 12px; border-bottom: 1px solid var(--line); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.id { font: 700 13.5px/1.4 var(--mono); white-space: nowrap; }
  td.num { font-family: var(--mono); text-align: center; }
  .expander { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: inherit; }
  .expander::before { content: "▸ "; color: var(--muted); }
  tr.open .expander::before { content: "▾ "; }
  tr.detail td { background: var(--panel-2); }
  tr.flash td { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--brass) 30%, transparent); } }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 20px; font-size: 14px; }
  .detail-grid b { display: block; font: 600 11px/1.3 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .sample-note { font-size: 12.5px; color: var(--partial); }
  .linkish { background: none; border: 0; padding: 0; color: var(--focus); font: 700 13px/1.4 var(--mono); cursor: pointer; text-decoration: underline; margin-right: 8px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }

  /* Roadmap */
  .road { display: flex; gap: 4px; margin-top: 6px; }
  .seg { min-width: 0; }
  .seg-bar { height: 34px; background: var(--unassessed); border-radius: 3px; overflow: hidden; position: relative; }
  .seg-fill { height: 100%; background: var(--brass); }
  .seg-bar span { position: absolute; inset: 0; display: grid; place-items: center; font: 700 13px/1 var(--mono); color: var(--text); }
  .seg-label { margin-top: 8px; font-size: 13.5px; }
  .seg-label b { display: block; font: 600 12px/1.2 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--on-ink); border: 1px solid var(--brass); padding: 10px 16px; border-radius: var(--radius); font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .toast.show { opacity: 1; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 1100px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .kpis .kpi.met { grid-column: span 2; }
    .cockpit-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 760px) {
    .layout { grid-template-columns: minmax(0, 1fr); padding: 16px; }
    /* Phone order: view tabs, the view itself, then the ownership card and note. */
    aside { display: contents; }
    .nav { order: 1; } main { order: 2; } .own { order: 3; } aside .note { order: 4; }
    .topbar-inner { padding: 12px 16px; }
    .nav { flex-direction: row; overflow-x: auto; }
    .nav button { border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; }
    .nav button[aria-current="page"] { border-bottom-color: var(--brass); }
    .nav .count { float: none; margin-left: 6px; }
    .road { flex-direction: column; }
    .seg { flex: none !important; }
    /* Tables become stacked cards */
    table, tbody, tr, td { display: block; width: 100%; }
    thead { display: none; }
    tr { border-bottom: 1px solid var(--line); padding: 8px 0; }
    tr:last-child { border-bottom: 0; }
    td { border: 0; padding: 4px 14px; }
    td[data-label]::before { content: attr(data-label); display: block; font: 600 11px/1.3 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    td.num { text-align: left; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 2 36 8v12c0 9-7 15.5-16 18C11 35.5 4 29 4 20V8z" fill="#c9a24b"/>
        <path d="M20 6 32 10.5V20c0 7-5.3 12-12 14-6.7-2-12-7-12-14v-9.5z" fill="#0f1d33"/>
        <path d="m20 11 2.6 5.4 5.9.8-4.3 4.1 1 5.8L20 24.3l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="#fff"/>
      </svg>
      <div>
        <div class="brand-name">Vets 4 Life</div>
        <h1>CMMC Readiness</h1>
        <div class="client"><span id="clientName">Sample Client</span> · Level 2 · NIST SP 800-171 Rev 2<span id="sampleBadge" class="sample-badge" hidden>SAMPLE DATA</span></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="btnBlank" type="button">Start blank assessment</button>
      <button class="btn" id="btnSample" type="button">Load sample</button>
      <button class="btn" id="btnExport" type="button">Export JSON</button>
      <button class="btn" id="btnImport" type="button">Import JSON</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button class="btn" id="btnTheme" type="button" aria-label="Toggle light or dark mode">◐ Theme</button>
    </div>
  </div>
</header>

<div class="layout">
  <aside>
    <nav class="nav" id="nav" aria-label="Dashboard views"></nav>
    <section class="card own" aria-labelledby="ownTitle" hidden>
      <h2 id="ownTitle">V4L Ownership <span class="sub">Internal</span></h2>
      <dl id="ownership"></dl>
    </section>
    <p class="note">Visualizes the Atomic tool's data model. It does not run scans or connect to systems. Your changes save in this browser only; use Export to move them.</p>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<!-- Internal only and not published. If the file is missing, the ownership panel stays hidden. -->
<script src="internal.js"></script>
<script src="app.js"></script>
</body>
</html>
